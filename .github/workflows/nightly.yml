name: Android App CI - Nightly
on:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create keystore.properties file for release
        run: |
          echo "storeFile = android.jks" >> keystore.properties
          echo "storePassword = ${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
          echo "keyAlias = ${{ secrets.SIGNING_KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword = ${{ secrets.SIGNING_KEY_PASSWORD }}" >> keystore.properties
        shell: bash

      - name: Restore android.jks
        run: echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > app/android.jks
        
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Build with Gradle
        run: ./gradlew app:assembleRelease

      - name: Upload artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: hymnal-nightly.apk
          path: ./app/release/app-release.apk
          compression-level: 0
        
